name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Automated tests
        run: npm test

      - name: Prepare static build (base path / custom domain)
        run: |
          # Hosting statis: API route server-only (healthcheck platform) tidak dipakai.
          rm -rf src/app/api
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME
          elif [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Build (static export)
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "Variabel NEXT_PUBLIC_SUPABASE_URL belum diisi di Settings > Variables"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_KEY" || { echo "Variabel NEXT_PUBLIC_SUPABASE_KEY belum diisi di Settings > Variables"; exit 1; }
          npm run build

      - name: Verify PWA files in output
        run: |
          test -f out/index.html
          test -f out/manifest.webmanifest
          test -f out/sw.js
          test -f out/404.html
          test -f out/icons/icon-512.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
